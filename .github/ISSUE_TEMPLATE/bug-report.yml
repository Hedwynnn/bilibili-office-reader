name: Bug 报告
description: 报告可重复出现的功能或兼容性问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先搜索现有 Issue，并对日志和截图中的个人信息进行脱敏。
        **请勿提交 Cookie、密码、访问令牌或完整请求头。**
  - type: input
    id: script-version
    attributes:
      label: 脚本版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器
      placeholder: 例如 Chrome 140
    validations:
      required: true
  - type: input
    id: manager
    attributes:
      label: 用户脚本管理器
      placeholder: 例如 Tampermonkey 5.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请从打开页面开始，列出尽量简短且稳定的步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的错误与截图
      description: 可粘贴控制台错误或拖入截图。请先隐藏 UID、动态内容和登录信息。
      render: shell
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，且没有提交任何 Cookie、密码、令牌或完整请求头。
          required: true
